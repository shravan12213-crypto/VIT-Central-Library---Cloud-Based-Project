<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - VIT Pune Library</title>
    <link rel="stylesheet" href="../assets/css/contact.css">
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <script type="text/javascript">
        // Initialize EmailJS immediately
        (function() {
            // REPLACE 'YOUR_PUBLIC_KEY' WITH YOUR ACTUAL PUBLIC KEY
            emailjs.init("service_yw57p45"); 
        })();
    </script>
</head>
<body>
    <div class="hero-section">
        <div class="header-content">
            <img src="https://uploads.onecompiler.io/43z634ggp/43z6355td/VIT-Pune-Logo.png" alt="VIT Logo" class="logo">
            <div class="header-text">
                <h1>Contact Us</h1>
                <p class="subtitle-text">We are here to help with your library queries</p>
            </div>
        </div>
    </div>

   <nav>
    <div class="nav-container">
        <a href="../index.html">Home</a>
        <a href="about.html">About</a>
        <a href="book-rental.html">Book Rental</a>
        <a href="readers-club.html">Readers Club</a>
        <a href="contact.html">Contact</a> <a href="https://www.vit.edu/" target="_blank">VIT Website</a>
    </div>
</nav>

    <div class="container">
        <div class="form-section">
            <h2>📩 Send us a Message</h2>
            <p class="subtitle">Fill out the form below and we will get back to you shortly.</p>

            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" required placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" required placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="subject">Subject:</label>
                    <input type="text" id="subject" required placeholder="What is this regarding?">
                </div>

                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" rows="5" required placeholder="Type your message here..."></textarea>
                </div>

                <div class="form-submit">
                    <button type="submit" id="submit-btn" class="submit-button">Send Message</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p class="footer-main">© 2025 Central Library, VIT Pune</p>
    </footer>

    <script src="../assets/js/contact.js"></script>
</body>
</html>
